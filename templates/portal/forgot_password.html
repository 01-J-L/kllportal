{% extends 'layout.html' %}
{% block content %}
<div class="login-wrapper">
  <div class="login-card" style="max-width: 480px;">

    <div class="login-header-wave">
      <svg viewBox="0 0 500 150" preserveAspectRatio="none">
        <path d="M0.00,49.98 C150.00,140.00 349.80,-40.00 500.00,49.98 L500.00,150.00 L0.00,150.00 Z" fill="#ffffff"></path>
      </svg>
    </div>

    <div class="login-body">
      <h4>Forgot Password</h4>
      <p class="text-muted small mb-3">Enter your registered email address and we'll send you a link to reset your password.</p>

      <form method="POST" action="{{ url_for('forgot_password') }}">
        <label class="form-label">Email address</label>
        <div class="input-group-custom">
          <input type="email" name="email" required placeholder="Enter your email" autofocus>
        </div>

        <button type="submit" class="btn-coral-signin">Send Reset Link</button>

        <div class="text-center mt-3 pt-3 border-top small text-muted">
          <a href="{{ url_for('login') }}" class="fw-bold text-decoration-none" style="color: #1e60d5;">Back to Login</a>
        </div>
      </form>
    </div>

  </div>
</div>
{% endblock %}
