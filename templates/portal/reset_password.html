{% extends 'layout.html' %}
{% block content %}
<div class="login-wrapper">
  <div class="login-card" style="max-width: 480px;">

    <div class="login-header-wave">
      <svg viewBox="0 0 500 150" preserveAspectRatio="none">
        <path d="M0.00,49.98 C150.00,140.00 349.80,-40.00 500.00,49.98 L500.00,150.00 L0.00,150.00 Z" fill="#ffffff"></path>
      </svg>
    </div>

    <div class="login-body">
      <h4>Reset Password</h4>
      <p class="text-muted small mb-3">Enter your new password below.</p>

      <form method="POST" action="{{ url_for('reset_password', token=token) }}">
        <label class="form-label">New Password</label>
        <div class="input-group-custom">
          <input type="password" id="resetPassword" name="password" required minlength="6" placeholder="Min. 6 characters">
          <button type="button" class="btn-toggle-pw" onclick="toggleResetPw()">
            <i class="fa fa-eye" id="eyeIconReset"></i>
          </button>
        </div>

        <label class="form-label">Confirm New Password</label>
        <div class="input-group-custom">
          <input type="password" id="confirmResetPassword" name="confirm_password" required minlength="6" placeholder="Confirm your password">
          <button type="button" class="btn-toggle-pw" onclick="toggleConfirmPw()">
            <i class="fa fa-eye" id="eyeIconConfirm"></i>
          </button>
        </div>

        <button type="submit" class="btn-coral-signin">Update Password</button>

        <div class="text-center mt-3 pt-3 border-top small text-muted">
          <a href="{{ url_for('login') }}" class="fw-bold text-decoration-none" style="color: #1e60d5;">Back to Login</a>
        </div>
      </form>
    </div>

  </div>
</div>

<script>
  function toggleResetPw() {
    const pw = document.getElementById('resetPassword');
    const icon = document.getElementById('eyeIconReset');
    if (pw.type === 'password') { pw.type = 'text'; icon.classList.replace('fa-eye', 'fa-eye-slash'); }
    else { pw.type = 'password'; icon.classList.replace('fa-eye-slash', 'fa-eye'); }
  }
  function toggleConfirmPw() {
    const pw = document.getElementById('confirmResetPassword');
    const icon = document.getElementById('eyeIconConfirm');
    if (pw.type === 'password') { pw.type = 'text'; icon.classList.replace('fa-eye', 'fa-eye-slash'); }
    else { pw.type = 'password'; icon.classList.replace('fa-eye-slash', 'fa-eye'); }
  }
</script>
{% endblock %}
